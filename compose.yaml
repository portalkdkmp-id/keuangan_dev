name: keuangan

x-app: &app
  image: keuangan-app:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  env_file:
    - .env
  working_dir: /var/www/keuangan
  volumes:
    - ./public:/var/www/keuangan/public
    - ./storage:/var/www/keuangan/storage
  restart: unless-stopped
  init: true

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${FPM_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  queue:
    <<: *app
    profiles: ["queue"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
