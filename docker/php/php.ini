expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 512M
upload_max_filesize = 55M
post_max_size = 60M
max_execution_time = 120
max_input_time = 120
date.timezone = Asia/Jakarta
session.cookie_httponly = On
session.cookie_samesite = Lax
