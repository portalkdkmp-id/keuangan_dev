name: deploy-production

on:
  workflow_run:
    workflows: ["tests"]
    branches: ["main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
      DEPLOY_QUEUE: ${{ vars.DEPLOY_QUEUE }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS secret}"

          SSH_PORT="${SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/keuangan}"
          DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"

          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" == /* ]]
          [[ "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/keuangan}"
          DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
          DEPLOY_QUEUE="${DEPLOY_QUEUE:-false}"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" "$DEPLOY_BRANCH" "$DEPLOY_QUEUE" <<'REMOTE'
          set -euo pipefail

          deploy_path="$1"
          deploy_branch="$2"
          deploy_queue="$3"

          cd "$deploy_path"
          git fetch --prune origin "$deploy_branch"
          git switch "$deploy_branch"
          git merge --ff-only "origin/$deploy_branch"
          APP_PATH="$deploy_path" ./scripts/deploy.sh

          if [ "$deploy_queue" = "true" ]; then
              docker compose --profile queue up -d queue
          fi

          docker compose --profile queue ps
          REMOTE
